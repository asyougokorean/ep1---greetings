  <script id="ayg-core-script">
    (function () {
      'use strict';

      /* =========================================================================
       * 1. DETECT STANDALONE LEARNER MODE FIRST (ZERO INDEXEDDB DEPENDENCY)
       * ========================================================================= */
      function readEmbeddedPayload() {
        const isLockedAttr = document.documentElement.getAttribute('data-learner-only') === 'true';
        const el = document.getElementById('EMBEDDED_QUIZ_PAYLOAD');
        if (!el) return isLockedAttr ? {} : null;
        const rawText = (el.textContent || '').trim();
        if (!rawText) return isLockedAttr ? {} : null;
        try {
          return JSON.parse(rawText);
        } catch (err) {
          console.error('Failed to parse EMBEDDED_QUIZ_PAYLOAD:', err);
          return isLockedAttr ? {} : null;
        }
      }

      const EMBEDDED_DATA = readEmbeddedPayload();
      const IS_LEARNER_ONLY = Boolean(
        document.documentElement.getAttribute('data-learner-only') === 'true' ||
        (EMBEDDED_DATA && Array.isArray(EMBEDDED_DATA.questions))
      );

      /* =========================================================================
       * 2. INDEXEDDB STORAGE & AUTO-RECOVERY (AsYouGoKoreanDB)
       * ========================================================================= */
      const DB_NAME = 'AsYouGoKoreanDB';
      const STORE_NAME = 'studio_projects';
      const PRIMARY_KEY = 'ep1_manual_audio_project_v2';
      const LEGACY_KEYS = ['ep1_manual_audio_project_v1'];
      const LS_FALLBACK_KEY = 'ayg_ep1_fallback_v2';

      function openDb() {
        return new Promise((resolve, reject) => {
          if (!window.indexedDB) {
            reject(new Error('IndexedDB not supported'));
            return;
          }
          // Open without forcing a lower version so existing stores are preserved
          const probeReq = window.indexedDB.open(DB_NAME);
          probeReq.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains(STORE_NAME)) {
              db.createObjectStore(STORE_NAME);
            }
          };
          probeReq.onsuccess = (e) => {
            const db = e.target.result;
            if (db.objectStoreNames.contains(STORE_NAME)) {
              resolve(db);
              return;
            }
            const nextVersion = (db.version || 1) + 1;
            db.close();
            const upgradeReq = window.indexedDB.open(DB_NAME, nextVersion);
            upgradeReq.onupgradeneeded = (ev) => {
              const upDb = ev.target.result;
              if (!upDb.objectStoreNames.contains(STORE_NAME)) {
                upDb.createObjectStore(STORE_NAME);
              }
            };
            upgradeReq.onsuccess = (ev) => resolve(ev.target.result);
            upgradeReq.onerror = () => reject(upgradeReq.error);
          };
          probeReq.onerror = () => reject(probeReq.error || new Error('Failed to open IndexedDB'));
        });
      }

      async function loadProjectFromDb() {
        if (IS_LEARNER_ONLY) {
          return normalizeQuiz(EMBEDDED_DATA);
        }
        try {
          const db = await openDb();
          const result = await new Promise((resolve) => {
            const tx = db.transaction(STORE_NAME, 'readonly');
            const store = tx.objectStore(STORE_NAME);
            const req = store.get(PRIMARY_KEY);
            req.onsuccess = () => {
              if (req.result && Array.isArray(req.result.questions) && req.result.questions.length > 0) {
                resolve({ data: req.result, recovered: false });
                return;
              }
              // Auto-recover from previous v1 key if user already saved work on this origin
              const legacyReq = store.get(LEGACY_KEYS[0]);
              legacyReq.onsuccess = () => {
                if (legacyReq.result && Array.isArray(legacyReq.result.questions) && legacyReq.result.questions.length > 0) {
                  resolve({ data: legacyReq.result, recovered: true });
                } else {
                  resolve(null);
                }
              };
              legacyReq.onerror = () => resolve(null);
            };
            req.onerror = () => resolve(null);
          });
          db.close();

          if (result && result.data) {
            const normalized = normalizeQuiz(result.data);
            if (result.recovered) {
              await saveProjectToDb(normalized);
            }
            return normalized;
          }
        } catch (err) {
          console.warn('IndexedDB read warning:', err);
        }

        try {
          const raw = window.localStorage.getItem(LS_FALLBACK_KEY) || window.localStorage.getItem('ayg_ep1_fallback_v1');
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed && Array.isArray(parsed.questions) && parsed.questions.length > 0) {
              return normalizeQuiz(parsed);
            }
          }
        } catch (_) {}
        return null;
      }

      async function saveProjectToDb(quizObj) {
        if (IS_LEARNER_ONLY) return 'ok';
        try {
          const db = await openDb();
          await new Promise((resolve, reject) => {
            const tx = db.transaction(STORE_NAME, 'readwrite');
            const store = tx.objectStore(STORE_NAME);
            store.put(quizObj, PRIMARY_KEY);
            tx.oncomplete = () => resolve(true);
            tx.onerror = () => reject(tx.error);
          });
          db.close();
          return 'idb';
        } catch (err) {
          try {
            window.localStorage.setItem(LS_FALLBACK_KEY, JSON.stringify(quizObj));
            return 'ls';
          } catch (_) {
            return 'err';
          }
        }
      }

      /* =========================================================================
       * 5. MEDIA HELPERS: IMAGE COMPRESSION & AUDIO DURATION DETECTOR
       * ========================================================================= */
      function compressImageFile(file, maxWidth = 960, quality = 0.84) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = (ev) => {
            const img = new Image();
            img.onload = () => {
              let w = img.width;
              let h = img.height;
              if (w > maxWidth) {
                h = Math.round((h * maxWidth) / w);
                w = maxWidth;
              }
              const canvas = document.createElement('canvas');
              canvas.width = w;
              canvas.height = h;
              const ctx = canvas.getContext('2d');
              ctx.fillStyle = '#0F203C';
              ctx.fillRect(0, 0, w, h);
              ctx.drawImage(img, 0, 0, w, h);
              resolve(canvas.toDataURL('image/jpeg', quality));
            };
            img.onerror = () => reject(new Error('이미지 변환에 실패했습니다.'));
            img.src = ev.target.result;
          };
          reader.onerror = () => reject(new Error('이미지 파일을 읽지 못했습니다.'));
          reader.readAsDataURL(file);
        });
      }

      function formatAudioDuration(seconds) {
        if (!Number.isFinite(seconds) || seconds <= 0) return '0:00.0';
        const mins = Math.floor(seconds / 60);
        const secs = (seconds % 60).toFixed(1).padStart(4, '0');
        return `${mins}:${secs}`;
      }

      function formatBytesMB(bytes) {
        if (!bytes || bytes <= 0) return '0.00 MB';
        const mb = bytes / (1024 * 1024);
        if (mb < 0.1) {
          return `${(bytes / 1024).toFixed(1)} KB (${mb.toFixed(2)} MB)`;
        }
        return `${mb.toFixed(2)} MB`;
      }

      function readAudioWithMetadata(file) {
        return new Promise((resolve, reject) => {
          const isAudio =
            (file.type && file.type.startsWith('audio/')) ||
            /\.(mp3|wav|m4a|ogg|aac|webm)$/i.test(file.name || '');
          if (!isAudio) {
            reject(new Error('오디오 파일(.mp3, .wav, .m4a 등)만 업로드할 수 있습니다.'));
            return;
          }

          const reader = new FileReader();
          reader.onload = (ev) => {
            const dataUrl = ev.target.result;
            const probe = new Audio();
            probe.preload = 'metadata';
            probe.src = dataUrl;

            const finalize = (dur) => {
              resolve({
                name: file.name || 'sentence-audio.mp3',
                durationSec: Number.isFinite(dur) ? dur : 0,
                durationText: formatAudioDuration(dur),
                size: file.size || 0,
                dataUrl
              });
            };

            probe.onloadedmetadata = () => finalize(probe.duration);
            probe.onerror = () => finalize(0);
          };
          reader.onerror = () => reject(new Error('오디오 파일 읽기에 실패했습니다.'));
          reader.readAsDataURL(file);
        });
      }

      function registerAudioInPool(payload) {
        const pool = state.quiz.audioPool;
        const existingId = Object.keys(pool).find((id) => pool[id] && pool[id].dataUrl === payload.dataUrl);
        if (existingId) {
          return { audioId: existingId, reused: true };
        }
        const id = 'aud_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
        pool[id] = {
          id,
          name: payload.name,
          durationSec: payload.durationSec,
          durationText: payload.durationText,
          size: payload.size,
          dataUrl: payload.dataUrl
        };
        return { audioId: id, reused: false };
      }

      /* =========================================================================
       * 6. DETERMINISTIC ROMANIZATION HELPER (MANUAL BUTTON)
       * ========================================================================= */
      const ROMAN_LOOKUP = {
        '안녕하세요': 'an-nyeong-ha-se-yo',
        '죄송합니다': 'joe-song-ham-ni-da',
        '죄송해요': 'joe-song-hae-yo',
        '괜찮아요': 'gwaen-cha-na-yo',
        '괜찮습니다': 'gwaen-chan-seum-ni-da',
        '감사합니다': 'gam-sa-ham-ni-da',
        '감사해요': 'gam-sa-hae-yo',
        '실례합니다': 'sil-lye-ham-ni-da',
        '실례해요': 'sil-lye-hae-yo',
        '반갑습니다': 'ban-gap-seum-ni-da',
        '반가워요': 'ban-ga-wo-yo'
      };

      function generateRomanization(korean) {
        const clean = String(korean || '').trim().replace(/[?.!,~]+$/g, '');
        if (ROMAN_LOOKUP[clean]) return ROMAN_LOOKUP[clean];

        const L = ['g', 'kk', 'n', 'd', 'tt', 'r', 'm', 'b', 'pp', 's', 'ss', '', 'j', 'jj', 'ch', 'k', 't', 'p', 'h'];
        const V = ['a', 'ae', 'ya', 'yae', 'eo', 'e', 'yeo', 'ye', 'o', 'wa', 'wae', 'oe', 'yo', 'u', 'wo', 'we', 'wi', 'yu', 'eu', 'ui', 'i'];
        const T = ['', 'k', 'k', 'k', 'n', 'n', 'n', 't', 'l', 'k', 'm', 'p', 'l', 't', 'p', 'l', 'm', 'p', 'p', 't', 't', 'ng', 't', 't', 'k', 't', 'p', 't'];

        return String(korean || '')
          .trim()
          .split(/\s+/)
          .map((word) => {
            const syls = Array.from(word).map((ch) => {
              const code = ch.charCodeAt(0) - 0xAC00;
              if (code < 0 || code > 11171) return { raw: ch };
              return { l: Math.floor(code / 588), v: Math.floor((code % 588) / 28), t: code % 28 };
            });
            return syls
              .map((cur, i) => {
                if (cur.raw !== undefined) return cur.raw;
                let onset = L[cur.l];
                let coda = T[cur.t];
                const prev = i > 0 ? syls[i - 1] : null;
                const next = i < syls.length - 1 ? syls[i + 1] : null;
                if ((cur.t === 17 || cur.t === 18) && next && next.raw === undefined && next.l === 2) coda = 'm';
                if (prev && prev.raw === undefined && prev.t === 8 && cur.l === 5) onset = 'l';
                return onset + V[cur.v] + coda;
              })
              .join('-');
          })
          .join(' ');
      }

      function stopPlayback() {
        try {
          playerAudio.pause();
          playerAudio.currentTime = 0;
        } catch (_) {}
        state.playingTriggerKey = '';
        updateAudioVisualsInDom();
      }

      function playOrToggleClip(audioId, triggerKey) {
        const clip = getClip(audioId);
        if (!clip || !clip.dataUrl) {
          if (!IS_LEARNER_ONLY) {
            showToast('오디오 미등록 (편집 탭에서 업로드)', 'amber');
          }
          return;
        }

        if (state.playingTriggerKey === triggerKey && !playerAudio.paused) {
          stopPlayback();
          return;
        }

        try {
          playerAudio.pause();
          playerAudio.src = clip.dataUrl;
          playerAudio.currentTime = 0;
          state.playingTriggerKey = triggerKey;
          updateAudioVisualsInDom();

          const promise = playerAudio.play();
          if (promise && typeof promise.catch === 'function') {
            promise.catch(() => {
              state.playingTriggerKey = '';
              updateAudioVisualsInDom();
            });
          }
        } catch (_) {
          state.playingTriggerKey = '';
          updateAudioVisualsInDom();
        }
      }

      playerAudio.addEventListener('ended', () => {
        state.playingTriggerKey = '';
        updateAudioVisualsInDom();
      });

      function updateAudioVisualsInDom() {
        document.querySelectorAll('[data-audio-key]').forEach((el) => {
          const key = el.getAttribute('data-audio-key');
          const kind = el.getAttribute('data-audio-kind') || 'pill';
          const active = Boolean(state.playingTriggerKey && state.playingTriggerKey === key);

          if (kind === 'pill') {
            el.classList.toggle('speaker-btn-playing', active);
            el.innerHTML = active
              ? `<span class="inline-flex items-end gap-[2px] h-3.5"><span class="wave-bar"></span><span class="wave-bar"></span><span class="wave-bar"></span></span>`
              : `<span class="text-[15px] leading-none">🔊</span>`;
          } else if (kind === 'editor-btn') {
            el.classList.toggle('bg-[#10B981]', active);
            el.classList.toggle('text-white', active);
            el.classList.toggle('border-[#10B981]', active);
            el.innerHTML = active ? '⏹ 정지' : '▶ 미리듣기';
          } else if (kind === 'step3-card') {
            el.classList.toggle('ring-4', active);
            el.classList.toggle('ring-emerald-400/40', active);
          }

      }

          .replace(/&/g, '&amp;')

          .replace(/"/g, '&quot;')

      function showToast(msg, tone = 'slate') {
        const root = document.getElementById('toast-root');

            ? 'bg-[#10B981] text-white'

        toast.className = `${cls} px-4 py-2.5 rounded-2xl shadow-xl text-xs sm:text-sm font-bold animate-fade-up pointer-events-auto text-center`;
        toast.textContent = msg;
        root.appendChild(toast);
        setTimeout(() => {

        `;

        const close = () => { root.innerHTML = ''; };
        document.getElementById('ayg-modal-bg').onclick = (e) => { if (e.target.id === 'ayg-modal-bg') close(); };
        document.getElementById('ayg-modal-x').onclick = close;
        const cancelBtn = document.getElementById('ayg-modal-cancel');
        if (cancelBtn) cancelBtn.onclick = close;
        const okBtn = document.getElementById('ayg-modal-ok');
        if (okBtn) {
          okBtn.onclick = () => {
            if (typeof onConfirm === 'function') onConfirm();
            close();
          };
        }
      }

      /* =========================================================================
       * 10. LEARNER VIEW RENDERER (3-STEP INTERACTIVE SCENE QUIZ)
       * ========================================================================= */
      function getQuestionImageSrc(q, idx) {
        if (q.imageData && q.imageData.trim()) return q.imageData;
        const ans = (q.choices || []).find((c) => c.isCorrect) || q.choices[0];
        return buildScenePlaceholderSvg(q.sceneKey || 'taxi_smile', ans ? ans.korean : '', `EP. 1 · SCENE ${idx + 1}`);
      }

      function renderLearnerViewHtml(isCompactSidePreview = false) {
        const questions = state.quiz.questions;
        if (!questions.length) {
          return `<div class="ayg-card p-8 text-center text-sm text-slate-500">등록된 문항이 없습니다.</div>`;
        }

        if (state.isSummaryOpen && !isCompactSidePreview) {
          return renderFinalSummaryHtml();
        }

        const qIdx = Math.min(Math.max(0, state.currentIdx), questions.length - 1);
        const q = questions[qIdx];
        const isSolved = Boolean(state.solvedMap[q.id]);
        const wrongSet = state.wrongAttemptsMap[q.id] || new Set();
        const isHintOpen = Boolean(state.hintOpenMap[q.id]);
        const hasHint = Boolean(q.hint && q.hint.trim());
        const step3AudioId = getStep3EffectiveAudioId(q);
        const hasStep3Audio = Boolean(step3AudioId);

        const blurPct = Math.min(40, Math.max(0, Number(q.blurHeight ?? 23)));

        const progressPills = questions
          .map((item, i) => {
            const solved = Boolean(state.solvedMap[item.id]);
            const current = i === qIdx;
            let cls = 'w-3 h-2 bg-slate-200 hover:bg-slate-300';
            if (current) cls = 'w-6 h-2 bg-[#F59E0B] ring-2 ring-amber-400/35';
            else if (solved) cls = 'w-3.5 h-2 bg-[#10B981]';
            return `<button type="button" data-q-action="jump" data-q-index="${i}" title="Question ${i + 1}" class="${cls} rounded-full transition-all duration-200"></button>`;
          })
          .join('');

        const letters = ['A', 'B', 'C', 'D'];
        const correctChoice = q.choices.find((c) => c.isCorrect) || q.choices[0];

        const optionCards = q.choices
          .map((choice, cIdx) => {
            const letter = letters[cIdx] || String(cIdx + 1);
            const isWrong = wrongSet.has(choice.id);
            const isCorrectShown = isSolved && choice.isCorrect;
            const shakeCls = state.shakenChoiceId === choice.id ? 'animate-shake' : '';

            const clip = getClip(choice.audioId);
            const hasClip = Boolean(clip && clip.dataUrl);
            const audioKey = `opt:${q.id}:${choice.id}`;
            const isPlaying = state.playingTriggerKey === audioKey;

            let cardState = isSolved ? 'is-locked' : 'cursor-pointer';
            let letterBadge = `<span class="w-8 h-8 rounded-xl bg-[#F7F7F2] border border-[#E2E0D5] text-slate-600 font-extrabold text-xs flex items-center justify-center shrink-0">${letter}</span>`;

            if (isCorrectShown) {
              cardState += ' is-correct';
              letterBadge = `<span class="w-8 h-8 rounded-xl bg-[#10B981] text-white font-extrabold text-sm flex items-center justify-center shrink-0">✓</span>`;
            } else if (isWrong) {
              cardState += ' is-wrong';
              letterBadge = `<span class="w-8 h-8 rounded-xl bg-red-500 text-white font-extrabold text-sm flex items-center justify-center shrink-0">✕</span>`;
            }

            // In standalone Learner-Only HTML, hide speaker button cleanly if no audio was uploaded for this choice
            const speakerControl = hasClip
              ? `<button
                  type="button"
                  data-audio-trigger="${esc(choice.audioId)}"
                  data-audio-key="${esc(audioKey)}"
                  data-audio-kind="pill"
                  title="Listen (${esc(clip.name)})"
                  aria-label="Listen to ${esc(choice.korean)}"
                  class="w-10 h-10 rounded-full border border-slate-300 bg-[#F7F7F2] hover:bg-emerald-50 hover:border-[#10B981] text-[#1E293B] shadow-2xs cursor-pointer flex items-center justify-center transition ${isPlaying ? 'speaker-btn-playing' : ''}"
                >
                  ${
                    isPlaying
                      ? `<span class="inline-flex items-end gap-[2px] h-3.5"><span class="wave-bar"></span><span class="wave-bar"></span><span class="wave-bar"></span></span>`
                      : `<span class="text-[15px] leading-none">🔊</span>`
                  }
                </button>`
              : !IS_LEARNER_ONLY
              ? `<button
                  type="button"
                  data-audio-trigger=""
                  data-audio-key="${esc(audioKey)}"
                  data-audio-kind="pill"
                  title="오디오 미등록 (편집 탭에서 업로드)"
                  class="w-10 h-10 rounded-full border border-slate-200 bg-slate-50 text-slate-300 cursor-pointer flex items-center justify-center transition"
                ><span class="text-[15px] leading-none">🔊</span></button>`
              : '';

            return `
              <div
                role="button"
                tabindex="${isSolved ? '-1' : '0'}"
                data-q-action="pick-option"
                data-choice-id="${esc(choice.id)}"
                class="option-card ${cardState} ${shakeCls} w-full px-4 py-3.5 flex items-center justify-between gap-3"
              >
                <div class="flex items-center gap-3.5 min-w-0 flex-1">
                  ${letterBadge}
                  <div class="min-w-0 flex-1">
                    <div class="font-kr text-[19px] sm:text-[20px] font-extrabold text-[#1E293B] leading-snug break-keep">
                      ${esc(choice.korean || '—')}
                    </div>
                    ${
                      choice.romanization && choice.romanization.trim()
                        ? `<div class="text-[13.5px] text-slate-500 font-medium mt-0.5 break-words">${esc(choice.romanization)}</div>`
                        : ''
                    }
                    ${
                      isWrong && !isSolved
                        ? `<div class="text-xs text-red-600 font-bold mt-1 animate-fade-up">Not quite — try another expression!</div>`
                        : ''
                    }
                  </div>
                </div>

                ${speakerControl ? `<div class="flex items-center gap-2 shrink-0">${speakerControl}</div>` : ''}
              </div>
            `;
          })
          .join('');

        const step3Key = `step3:${q.id}`;
        const isStep3Playing = state.playingTriggerKey === step3Key;

        return `
          <div class="w-full max-w-[490px] mx-auto select-none">
            <!-- Media Stage (Top of Card, 16:9) -->
            <div class="relative w-full aspect-video rounded-[22px] overflow-hidden bg-[#0F203C] border border-[#E5E3D8] shadow-sm mb-3.5">
              <img
                src="${getQuestionImageSrc(q, qIdx)}"
                alt="Scene ${qIdx + 1}"
                class="w-full h-full object-cover block transition-transform duration-300 ${state.sceneZoomPulse ? 'scale-[1.02]' : ''}"
              />

              <!-- Top-Left Pill Badge: "⏸ Your turn!" -> "▶ Real line!" -->
              <div class="absolute top-3.5 left-3.5 z-20">
                ${
                  isSolved
                    ? `<div class="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-full bg-[#10B981] text-white text-[13px] font-extrabold shadow-md animate-fade-up">
                        <span>▶ Real line!</span>
                       </div>`
                    : `<div class="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-full bg-[#F59E0B] text-[#1E293B] text-[13px] font-extrabold shadow-md">
                        <span>⏸ Your turn!</span>
                       </div>`
                }
              </div>

              <!-- Question Counter Pill (Top Right) -->
              <div class="absolute top-3.5 right-3.5 z-20 px-2.5 py-1 rounded-full bg-slate-900/70 text-white text-[11px] font-extrabold backdrop-blur-xs">
                ${qIdx + 1} / ${questions.length}
              </div>

              <!-- Bottom Subtitle Blur Overlay -->
              ${
                blurPct > 0
                  ? `
                  <div
                    style="
                      height: ${blurPct}%;
                      backdrop-filter: blur(${isSolved ? 0 : 14}px);
                      -webkit-backdrop-filter: blur(${isSolved ? 0 : 14}px);
                      background: ${
                        isSolved
                          ? 'linear-gradient(to bottom, rgba(0,0,0,0), rgba(0,0,0,0.2))'
                          : 'linear-gradient(to bottom, rgba(15,23,42,0.34), rgba(15,23,42,0.78))'
                      };
                    "
                    class="absolute inset-x-0 bottom-0 z-10 transition-all duration-500 flex items-end justify-end px-3.5 py-2 pointer-events-none"
                  >
                    <span class="text-[11.5px] font-bold ${
                      isSolved
                        ? 'text-emerald-200 bg-slate-900/60 px-2.5 py-0.5 rounded-full'
                        : 'text-white/90 drop-shadow-xs'
                    }">
                      ${isSolved ? 'subtitle revealed ✓' : 'subtitles hidden'}
                    </span>
                  </div>
                  `
                  : ''
              }
            </div>

            <!-- Main Interactive Quiz Card -->
            <div class="ayg-card p-5 sm:p-6">
              <!-- Top Step Label + Segmented Progress Pills + ? Button -->
              <div class="flex items-center justify-between gap-2 mb-3.5">
                <div class="text-[12px] font-extrabold tracking-wider uppercase ${
                  isSolved ? 'text-[#059669]' : 'text-slate-500'
                }">
                  ${isSolved ? '🔊 STEP 3 · LISTEN' : '⏸ STEP 2 · PICK'}
                </div>

                <div class="flex items-center gap-1.5 flex-wrap justify-center">
                  ${progressPills}
                </div>

                <button
                  type="button"
                  data-q-action="toggle-hint"
                  title="Grammar Hint"
                  class="w-7 h-7 rounded-full border border-slate-200 bg-white hover:bg-slate-50 text-slate-600 text-xs font-extrabold flex items-center justify-center shrink-0 transition"
                >?</button>
              </div>

              <!-- English Situational Prompt -->
              <h2 class="text-[19.5px] sm:text-[21px] leading-[1.36] font-extrabold text-[#1E293B] tracking-[-0.01em] mb-4">
                ${esc(q.prompt)}
              </h2>

              <!-- 3-Step Interactive Cards -->
              <div class="grid grid-cols-3 gap-2.5 mb-4">
                <!-- Card 1: 1. Watch the scene -->
                <button
                  type="button"
                  data-q-action="pulse-scene"
                  class="rounded-2xl p-3 text-left bg-[#ECFDF5] hover:bg-emerald-100/70 transition flex flex-col justify-between min-h-[78px]"
                >
                  <span class="w-6 h-6 rounded-full bg-[#10B981] text-white text-xs font-extrabold flex items-center justify-center">✓</span>
                  <span class="text-[12px] leading-tight font-bold text-[#059669] mt-2">1. Watch the scene</span>
                </button>

                <!-- Card 2: 2. Pick the line -->
                <div
                  class="rounded-2xl p-3 text-left transition flex flex-col justify-between min-h-[78px] ${
                    !isSolved ? 'bg-[#F59E0B] shadow-2xs' : 'bg-[#ECFDF5]'
                  }"
                >
                  ${
                    !isSolved
                      ? `<span class="w-6 h-6 rounded-full bg-[#1E293B] text-[#F59E0B] text-xs font-extrabold flex items-center justify-center">2</span>
                         <span class="text-[12px] leading-tight font-extrabold text-[#1E293B] mt-2">2. Pick the line</span>`
                      : `<span class="w-6 h-6 rounded-full bg-[#10B981] text-white text-xs font-extrabold flex items-center justify-center">✓</span>
                         <span class="text-[12px] leading-tight font-bold text-[#059669] mt-2">2. Pick the line</span>`
                  }
                </div>

                <!-- Card 3: 3. Hear the real line -->
                <button
                  type="button"
                  data-audio-trigger="${hasStep3Audio ? esc(step3AudioId) : ''}"
                  data-audio-key="${esc(step3Key)}"
                  data-audio-kind="step3-card"
                  class="rounded-2xl p-3 text-left transition flex flex-col justify-between min-h-[78px] ${
                    isSolved
                      ? 'bg-[#10B981] hover:bg-[#059669] text-white shadow-sm cursor-pointer'
                      : 'bg-slate-100 text-slate-500 cursor-pointer'
                  } ${isStep3Playing ? 'ring-4 ring-emerald-400/40' : ''}"
                >
                  <span class="w-6 h-6 rounded-full text-xs font-extrabold flex items-center justify-center ${
                    isSolved ? 'bg-white text-[#10B981]' : 'bg-white text-slate-500 border border-slate-200'
                  }">
                    ${
                      isStep3Playing
                        ? `<span class="inline-flex items-end gap-[1.5px] h-3"><span class="wave-bar"></span><span class="wave-bar"></span><span class="wave-bar"></span></span>`
                        : isSolved
                        ? '🔊'
                        : '3'
                    }
                  </span>
                  <span class="text-[12px] leading-tight font-extrabold mt-2 ${
                    isSolved ? 'text-white' : 'text-slate-600'
                  }">3. Hear the real line</span>
                </button>
              </div>

              <!-- Multiple Choice Option Cards (A, B, C, D) -->
              <div class="space-y-2.5">
                ${optionCards}
              </div>

              <!-- Hint Drawer -->
              ${
                isHintOpen && hasHint
                  ? `
                  <div class="mt-3.5 p-3.5 rounded-2xl bg-[#FFFBEB] border border-amber-200 text-[13.5px] text-amber-950 flex items-start gap-2.5 animate-fade-up">
                    <span class="text-base leading-none mt-0.5">💡</span>
                    <div class="leading-snug font-medium">${esc(q.hint)}</div>
                  </div>
                  `
                  : ''
              }

              <!-- Post-Answer Grammar & Nuance Note -->
              ${
                isSolved && correctChoice
                  ? `
                  <details open class="mt-4 rounded-2xl bg-[#ECFDF5] border border-emerald-200 overflow-hidden animate-fade-up">
                    <summary class="px-4 py-3 cursor-pointer flex items-center justify-between text-xs font-extrabold uppercase tracking-wider text-[#059669] select-none">
                      <span>📘 Grammar &amp; Nuance Note (-습니다 vs -해요)</span>
                      <span>▾</span>
                    </summary>
                    <div class="px-4 pb-4 pt-1 space-y-2.5">
                      <div class="p-3 rounded-xl bg-white border border-emerald-100 flex items-center justify-between gap-2">
                        <div>
                          <div class="font-kr text-lg font-extrabold text-[#1E293B]">${esc(correctChoice.korean)}</div>
                          <div class="text-xs font-bold text-[#059669]">${esc(correctChoice.romanization)} · ${esc(q.meaningEn)}</div>
                        </div>
                        ${
                          hasStep3Audio
                            ? `<button
                                type="button"
                                data-audio-trigger="${esc(step3AudioId)}"
                                data-audio-key="note:${esc(q.id)}"
                                data-audio-kind="pill"
                                title="Listen again"
                                class="w-10 h-10 rounded-full border border-emerald-200 bg-emerald-50 hover:bg-emerald-100 text-[#059669] flex items-center justify-center shrink-0 transition"
                              ><span class="text-[15px]">🔊</span></button>`
                            : ''
                        }
                      </div>
                      <p class="text-[13.5px] text-slate-700 leading-relaxed font-medium">
                        ${esc(q.grammarNote)}
                      </p>
                    </div>
                  </details>
                  `
                  : ''
              }

              <!-- Bottom Action Bar: Replay, Hint, Next Question -->
              <div class="mt-4 pt-3.5 border-t border-slate-100 flex flex-wrap items-center justify-between gap-2">
                <div class="flex items-center gap-2">
                  <button
                    type="button"
                    data-q-action="replay"
                    class="px-3.5 py-2.5 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 text-[#1E293B] font-extrabold text-[13px] inline-flex items-center gap-1.5 transition"
                  >
                    <span>🔄</span>
                    <span>Replay</span>
                  </button>

                  ${
                    hasHint
                      ? `<button
                          type="button"
                          data-q-action="toggle-hint"
                          class="px-3.5 py-2.5 rounded-xl border ${
                            isHintOpen
                              ? 'border-amber-300 bg-[#FFFBEB] text-amber-900'
                              : 'border-slate-200 bg-white hover:bg-slate-50 text-[#1E293B]'
                          } font-extrabold text-[13px] inline-flex items-center gap-1 transition"
                        >
                          <span>💡</span>
                          <span>Hint</span>
                        </button>`
                      : ''
                  }
                </div>

                <button
                  type="button"
                  data-q-action="next"
                  class="px-4 py-2.5 rounded-xl ${
                    isSolved
                      ? 'bg-[#10B981] hover:bg-[#059669] text-white shadow-xs'
                      : 'bg-slate-800 hover:bg-slate-900 text-white'
                  } font-extrabold text-[13px] inline-flex items-center gap-1.5 transition ml-auto"
                >
                  <span>${qIdx < questions.length - 1 ? 'Next Question →' : 'Finish Review →'}</span>
                </button>
              </div>
            </div>
          </div>
        `;
      }

      /* =========================================================================
       * 11. FINAL SUMMARY VIEW
       * ========================================================================= */
      function renderFinalSummaryHtml() {
        const questions = state.quiz.questions;
        const solvedCount = questions.filter((q) => state.solvedMap[q.id]).length;
        const firstTryCount = questions.filter((q) => state.firstTryMap[q.id]).length;

        const rows = questions
          .map((q, idx) => {
            const ans = q.choices.find((c) => c.isCorrect) || q.choices[0];
            const audioId = getStep3EffectiveAudioId(q);
            const hasAudio = Boolean(audioId);
            const key = `sum:${q.id}`;
            const playing = state.playingTriggerKey === key;

            const speakerBtn = hasAudio
              ? `<button
                  type="button"
                  data-audio-trigger="${esc(audioId)}"
                  data-audio-key="${esc(key)}"
                  data-audio-kind="pill"
                  title="Listen"
                  class="w-10 h-10 rounded-full border border-slate-300 bg-white hover:border-[#10B981] text-[#1E293B] flex items-center justify-center shrink-0 transition ${playing ? 'speaker-btn-playing' : ''}"
                ><span class="text-[15px]">🔊</span></button>`
              : !IS_LEARNER_ONLY
              ? `<button
                  type="button"
                  data-audio-trigger=""
                  data-audio-key="${esc(key)}"
                  data-audio-kind="pill"
                  title="오디오 미등록 (편집 탭에서 업로드)"
                  class="w-10 h-10 rounded-full border border-slate-200 bg-slate-50 text-slate-300 flex items-center justify-center shrink-0 transition"
                ><span class="text-[15px]">🔊</span></button>`
              : '';

            return `
              <div class="p-3.5 rounded-2xl bg-[#F7F7F2] border border-[#E5E3D8] flex items-center justify-between gap-3">
                <div class="min-w-0 flex-1">
                  <div class="flex items-center gap-2 flex-wrap">
                    <span class="text-[11px] font-extrabold text-[#059669] bg-emerald-100/70 px-2 py-0.5 rounded-full">Q${idx + 1}</span>
                    <span class="font-kr text-lg font-extrabold text-[#1E293B]">${esc(ans ? ans.korean : '')}</span>
                    <span class="text-xs font-bold text-[#059669]">${esc(ans ? ans.romanization : '')}</span>
                  </div>
                  <div class="text-xs text-slate-600 font-semibold mt-1">${esc(q.meaningEn)}</div>
                </div>
                ${speakerBtn}
              </div>
            `;
          })
          .join('');

        return `
          <div class="w-full max-w-[490px] mx-auto animate-fade-up">
            <div class="ayg-card p-6 space-y-5">
              <div class="text-center space-y-1.5">
                <span class="inline-block px-3.5 py-1 rounded-full bg-[#F59E0B] text-[#1E293B] text-xs font-extrabold">
                  Episode 1 Review Complete!
                </span>
                <h2 class="text-2xl font-extrabold text-[#1E293B]">${solvedCount} / ${questions.length} Solved</h2>
                <p class="text-xs sm:text-sm text-slate-500">First-try accuracy: <strong>${firstTryCount} / ${questions.length}</strong> · Learn as you go!</p>
              </div>

              <div class="space-y-2.5">${rows}</div>

              <div class="flex flex-col sm:flex-row gap-2.5 pt-2">
                <button
                  type="button"
                  data-q-action="restart-all"
                  class="flex-1 py-3 px-4 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 text-[#1E293B] font-extrabold text-sm transition"
                >🔄 Practice Again</button>
                ${
                  state.quiz.youtubeUrl && state.quiz.youtubeUrl.trim()
                    ? `<a
                        href="${esc(state.quiz.youtubeUrl)}"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="flex-1 py-3 px-4 rounded-xl bg-[#10B981] hover:bg-[#059669] text-white font-extrabold text-sm text-center transition"
                      >Back to YouTube ↗</a>`
                    : ''
                }
              </div>
            </div>
          </div>
        `;
      }

      /* =========================================================================
       * 12. MANUAL EDITOR & DIRECT AUDIO INTEGRATION RENDERER
       * ========================================================================= */
      function buildSharedAudioDropdownOptions(selectedId) {
        const items = Object.values(state.quiz.audioPool || {});
        if (!items.length) {
          return `<option value="">📂 이미 올린 오디오에서 선택 (0개)</option>`;
        }
        const sorted = items.slice().sort((a, b) => String(a.name).localeCompare(String(b.name), 'ko'));
        const opts = sorted
          .map((item) => {
            const sel = item.id === selectedId ? 'selected' : '';
            return `<option value="${esc(item.id)}" ${sel}>🎵 ${esc(item.name)} (${esc(item.durationText)})</option>`;
          })
          .join('');
        return `<option value="">📂 이미 올린 오디오에서 선택 (${items.length}개)</option>${opts}`;
      }

      function renderEditorViewHtml() {
        const questions = state.quiz.questions;
        const idx = Math.min(Math.max(0, state.editorIdx), Math.max(0, questions.length - 1));
        state.editorIdx = idx;
        state.currentIdx = idx;
        const q = questions[idx];

        const qTabs = questions
          .map((item, i) => {
            const ans = item.choices.find((c) => c.isCorrect) || item.choices[0];
            const label = ans && ans.korean ? ans.korean : '미입력';
            const uploadedChoicesCount = item.choices.filter((c) => Boolean(getClip(c.audioId))).length;
            const hasImg = Boolean(item.imageData && item.imageData.trim());
            const active = i === idx;
            return `
              <button
                type="button"
                data-ed-action="select-q"
                data-q-index="${i}"
                class="shrink-0 px-3.5 py-2 rounded-xl text-xs font-extrabold border transition flex items-center gap-1.5 ${
                  active
                    ? 'bg-[#0F203C] text-[#F59E0B] border-[#0F203C] shadow-2xs'
                    : 'bg-white text-slate-700 border-slate-200 hover:bg-slate-50'
                }"
              >
                <span>Q${i + 1}</span>
                <span class="font-kr max-w-[84px] truncate ${active ? 'text-white' : 'text-slate-500'}">· ${esc(label)}</span>
                <span class="px-1.5 py-0.5 rounded-md text-[10px] ${
                  hasImg ? 'bg-amber-400/20 text-amber-300' : 'bg-slate-100 text-slate-400'
                }">${hasImg ? '🖼️✓' : '🖼️'}</span>
                <span class="px-1.5 py-0.5 rounded-md text-[10px] ${
                  uploadedChoicesCount > 0 ? 'bg-emerald-500/20 text-emerald-300' : 'bg-slate-100 text-slate-400'
                }">🔊${uploadedChoicesCount}/${item.choices.length}</span>
              </button>

      /* =========================================================================

        const editorView = document.getElementById('editor-view');

        if (IS_LEARNER_ONLY) {
          // Pure Learner-Only Mode (Zero Studio UI)
          if (studioToolbar) studioToolbar.remove();
          if (editorView) editorView.remove();
          if (learnerOnlyHeader) {
            learnerOnlyHeader.classList.remove('hidden');
            learnerOnlyHeader.innerHTML = `
              <div class="max-w-[490px] mx-auto flex items-center gap-3">
                ${BRAND_EMBLEM_SVG}

                  <div class="text-[11px] font-extrabold uppercase tracking-wider text-slate-500 truncate">${esc(state.quiz.channelTitle)}</div>
                  <h1 class="text-sm font-extrabold text-[#1E293B] truncate">${esc(state.quiz.episodeSubtitle)}</h1>
                </div>
              </div>
            `;
          }
          if (mainStage) {
            mainStage.className = 'flex-1 py-6 px-4 flex flex-col justify-center';
          }
          if (learnerView) {
            learnerView.classList.remove('hidden');
            learnerView.innerHTML = renderLearnerViewHtml(false);
            bindLearnerEvents(learnerView);
          }
          return;
        }

        // Studio Mode
        if (learnerOnlyHeader) learnerOnlyHeader.classList.add('hidden');

        if (studioToolbar) {
          studioToolbar.classList.remove('hidden');
          studioToolbar.innerHTML = `
            <div class="max-w-6xl mx-auto flex flex-wrap items-center justify-between gap-3">

                ${BRAND_EMBLEM_SVG}
                <div class="min-w-0">
                  <div class="flex items-center gap-2">
                    <span class="text-sm font-extrabold text-[#0F203C] tracking-tight">${esc(state.quiz.channelTitle)}</span>
                    <span id="save-status-badge" class="hidden sm:inline-block text-[11px] font-bold text-[#059669] bg-[#ECFDF5] px-2 py-0.5 rounded-full border border-emerald-200">
                      ${esc(state.saveIndicator)}
                    </span>
                  </div>
                  <div class="text-xs font-semibold text-slate-500 truncate max-w-[260px] sm:max-w-md">
                    ${esc(state.quiz.episodeSubtitle)}
                  </div>
                </div>
              </div>

                    data-nav="learner"

                    }"
                  >🎮 퀴즈 미리보기 (Learner View)</button>
                  <button
                    type="button"

                    }"
                  >✏️ 매뉴얼 편집 &amp; 오디오 통합 (Editor)</button>

                <button

                <label class="px-3 py-2 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 text-xs font-bold text-slate-700 transition cursor-pointer">

                  <input id="nav-load-json" type="file" accept=".json,application/json" class="hidden" />
                </label>

                <button
                  type="button"

                  class="px-3.5 py-2 rounded-xl bg-[#10B981] hover:bg-[#059669] text-white text-xs font-extrabold shadow-2xs transition"
                >🚀 배포용 단독 HTML 내보내기</button>
              </div>

          `;
          bindTopNavEvents(studioToolbar);
        }

        if (state.viewMode === 'learner') {
          if (mainStage) mainStage.className = 'flex-1 py-6 px-4 flex flex-col justify-center';
          if (editorView) editorView.classList.add('hidden');
          if (learnerView) {
            learnerView.classList.remove('hidden');
            learnerView.innerHTML = renderLearnerViewHtml(false);
            bindLearnerEvents(learnerView);
          }
        } else {
          if (mainStage) mainStage.className = 'flex-1 py-6 px-4 flex flex-col';
          if (learnerView) learnerView.classList.add('hidden');
          if (editorView) {
            editorView.classList.remove('hidden');
            editorView.innerHTML = renderEditorViewHtml();
            bindLearnerEvents(editorView);
            bindEditorEvents(editorView);
          }

      }

      function refreshSidePreview() {
        const container = document.getElementById('live-side-preview');
        if (!container) return;
        container.innerHTML = renderLearnerViewHtml(true);
        bindLearnerEvents(container);
      }

      /* =========================================================================
       * 14. LEARNER EVENT HANDLERS
       * ========================================================================= */
      function bindLearnerEvents(scope) {
        scope.querySelectorAll('[data-audio-trigger]').forEach((btn) => {
          btn.onclick = (e) => {
            e.stopPropagation();
            e.preventDefault();
            const audioId = btn.getAttribute('data-audio-trigger');
            const key = btn.getAttribute('data-audio-key');
            playOrToggleClip(audioId, key);
          };
        });

        scope.querySelectorAll('[data-q-action]').forEach((el) => {
          const trigger = (e) => {
            if (e.target && e.target.closest && e.target.closest('[data-audio-trigger]')) return;
            const act = el.getAttribute('data-q-action');
            const questions = state.quiz.questions;
            const q = questions[state.currentIdx];

            switch (act) {
              case 'pick-option': {
                if (!q || state.solvedMap[q.id]) return;
                const choiceId = el.getAttribute('data-choice-id');
                const chosen = q.choices.find((c) => c.id === choiceId);
                if (!chosen) return;

                if (chosen.isCorrect) {
                  const hadWrong = state.wrongAttemptsMap[q.id] && state.wrongAttemptsMap[q.id].size > 0;
                  if (state.firstTryMap[q.id] === undefined) state.firstTryMap[q.id] = !hadWrong;
                  state.solvedMap[q.id] = true;
                  state.shakenChoiceId = null;
                  rerenderActiveQuiz();

                  const step3Id = getStep3EffectiveAudioId(q);
                  if (step3Id && state.quiz.autoPlayOnCorrect) {
                    playOrToggleClip(step3Id, `step3:${q.id}`);
                  }
                } else {
                  if (!state.wrongAttemptsMap[q.id]) state.wrongAttemptsMap[q.id] = new Set();
                  state.wrongAttemptsMap[q.id].add(choiceId);
                  if (state.firstTryMap[q.id] === undefined) state.firstTryMap[q.id] = false;
                  state.shakenChoiceId = choiceId;
                  rerenderActiveQuiz();
                }
                break;
              }

              case 'replay': {
                if (!q) return;
                const step3Id = getStep3EffectiveAudioId(q);
                if (step3Id && state.solvedMap[q.id]) {
                  playOrToggleClip(step3Id, `step3:${q.id}`);
                } else {
                  stopPlayback();
                  delete state.solvedMap[q.id];
                  delete state.wrongAttemptsMap[q.id];
                  state.shakenChoiceId = null;
                  rerenderActiveQuiz();
                }
                break;
              }

              case 'reset-current': {
                if (!q) return;
                stopPlayback();
                delete state.solvedMap[q.id];
                delete state.wrongAttemptsMap[q.id];
                state.shakenChoiceId = null;
                rerenderActiveQuiz();
                break;
              }

              case 'toggle-hint': {
                if (!q) return;
                state.hintOpenMap[q.id] = !state.hintOpenMap[q.id];
                rerenderActiveQuiz();
                break;
              }

              case 'pulse-scene': {
                state.sceneZoomPulse = true;
                rerenderActiveQuiz();
                setTimeout(() => {
                  state.sceneZoomPulse = false;
                  rerenderActiveQuiz();
                }, 550);
                break;
              }

              case 'jump': {
                stopPlayback();
                const target = Number(el.getAttribute('data-q-index') || 0);
                state.currentIdx = target;
                state.editorIdx = target;
                state.isSummaryOpen = false;
                state.shakenChoiceId = null;
                renderApp();
                break;
              }

              case 'next': {
                stopPlayback();
                state.shakenChoiceId = null;
                if (state.currentIdx < questions.length - 1) {
                  state.currentIdx += 1;
                  state.editorIdx = state.currentIdx;
                  renderApp();
                } else if (state.viewMode === 'learner' || IS_LEARNER_ONLY) {
                  state.isSummaryOpen = true;
                  renderApp();
                } else {
                  showToast('마지막 문항입니다! 퀴즈 미리보기 탭에서 최종 결과 화면을 확인하세요.', 'green');
                }
                break;
              }

              case 'restart-all': {
                stopPlayback();
                state.solvedMap = {};
                state.wrongAttemptsMap = {};
                state.firstTryMap = {};
                state.hintOpenMap = {};
                state.currentIdx = 0;
                state.isSummaryOpen = false;
                state.shakenChoiceId = null;
                renderApp();
                break;
              }
            }
          };

          el.onclick = trigger;
          if (el.getAttribute('data-q-action') === 'pick-option') {
            el.onkeydown = (ke) => {
              if (ke.key === 'Enter' || ke.key === ' ') {
                if (ke.target && ke.target.closest && ke.target.closest('[data-audio-trigger]')) return;
                ke.preventDefault();
                trigger(ke);
              }
            };
          }
        });
      }

      function rerenderActiveQuiz() {
        if (state.viewMode === 'editor' && !IS_LEARNER_ONLY) {
          refreshSidePreview();
        } else {
          renderApp();
        }
      }

      /* =========================================================================
       * 15. MANUAL EDITOR & AUDIO UPLOAD EVENT HANDLERS
       * ========================================================================= */
      function bindEditorEvents(scope) {
        const q = state.quiz.questions[state.editorIdx];

        scope.querySelectorAll('[data-meta-input]').forEach((inp) => {
          inp.oninput = () => {
            const k = inp.getAttribute('data-meta-input');
            state.quiz[k] = inp.value;
            scheduleSave();
          };
        });

        const autoPlayToggle = document.getElementById('ed-autoplay-toggle');
        if (autoPlayToggle) {
          autoPlayToggle.onchange = () => {
            state.quiz.autoPlayOnCorrect = autoPlayToggle.checked;
            scheduleSave();
          };
        }

        scope.querySelectorAll('[data-ed-input]').forEach((inp) => {
          const kind = inp.getAttribute('data-ed-input');
          inp.oninput = () => {
            if (!q) return;
            if (kind === 'prompt') q.prompt = inp.value;
            else if (kind === 'hint') q.hint = inp.value;
            else if (kind === 'meaning') q.meaningEn = inp.value;
            else if (kind === 'grammar') q.grammarNote = inp.value;
            else if (kind === 'blur') {
              q.blurHeight = Number(inp.value);
              const lbl = document.getElementById('ed-blur-val');
              if (lbl) lbl.textContent = q.blurHeight + '%';
            } else if (kind === 'choice-kr') {
              const cIdx = Number(inp.getAttribute('data-choice-index'));
              if (q.choices[cIdx]) q.choices[cIdx].korean = inp.value;
            } else if (kind === 'choice-rom') {
              const cIdx = Number(inp.getAttribute('data-choice-index'));
              if (q.choices[cIdx]) q.choices[cIdx].romanization = inp.value;
            }
            scheduleSave();
            refreshSidePreview();
          };
        });

        scope.querySelectorAll('[data-choice-audio-upload]').forEach((inp) => {
          inp.onchange = async (e) => {
            const file = e.target.files && e.target.files[0];
            const cIdx = Number(inp.getAttribute('data-choice-audio-upload'));
            if (file && q && q.choices[cIdx]) {
              await handleChoiceAudioFile(file, q, cIdx);
            }
          };
        });

        scope.querySelectorAll('[data-choice-audio-pool]').forEach((sel) => {
          sel.onchange = () => {
            const cIdx = Number(sel.getAttribute('data-choice-audio-pool'));
            if (q && q.choices[cIdx]) {
              q.choices[cIdx].audioId = sel.value || '';
              scheduleSave();
              renderApp();
              if (sel.value) showToast('선택한 오디오가 연결되었습니다.', 'green');
            }
          };
        });

        scope.querySelectorAll('[data-choice-dropzone]').forEach((zone) => {
          const cIdx = Number(zone.getAttribute('data-choice-dropzone'));
          zone.ondragover = (e) => { e.preventDefault(); zone.classList.add('dropzone-active'); };
          zone.ondragleave = () => { zone.classList.remove('dropzone-active'); };
          zone.ondrop = async (e) => {
            e.preventDefault();
            zone.classList.remove('dropzone-active');
            const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
            if (file && q && q.choices[cIdx]) {
              await handleChoiceAudioFile(file, q, cIdx);
            }
          };
        });

        const sceneAudioInp = document.getElementById('ed-scene-audio-input');
        if (sceneAudioInp && q) {
          sceneAudioInp.onchange = async (e) => {
            const file = e.target.files && e.target.files[0];
            if (file) await handleSceneAudioFile(file, q);
          };
        }
        const sceneAudioPool = document.getElementById('ed-scene-audio-pool');
        if (sceneAudioPool && q) {
          sceneAudioPool.onchange = () => {
            q.sceneAudioId = sceneAudioPool.value || '';
            scheduleSave();
            renderApp();
          };
        }

        const imgDrop = document.getElementById('ed-img-dropzone');
        const imgInp = document.getElementById('ed-img-input');
        if (imgDrop && imgInp && q) {
          imgDrop.onclick = () => imgInp.click();
          imgInp.onchange = async (e) => {
            const file = e.target.files && e.target.files[0];
            if (file) await handleSceneImageFile(file, q);
          };
          imgDrop.ondragover = (e) => { e.preventDefault(); imgDrop.classList.add('dropzone-active'); };
          imgDrop.ondragleave = () => { imgDrop.classList.remove('dropzone-active'); };
          imgDrop.ondrop = async (e) => {
            e.preventDefault();
            imgDrop.classList.remove('dropzone-active');
            const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) await handleSceneImageFile(file, q);
          };
        }

        scope.querySelectorAll('[data-ed-action]').forEach((btn) => {
          btn.onclick = () => {
            const act = btn.getAttribute('data-ed-action');
            const questions = state.quiz.questions;

            switch (act) {
              case 'select-q': {
                stopPlayback();
                const tIdx = Number(btn.getAttribute('data-q-index'));
                state.editorIdx = tIdx;
                state.currentIdx = tIdx;
                renderApp();
                break;
              }
              case 'add-q': {
                stopPlayback();
                const uid = 'q_' + Date.now();
                questions.push({
                  id: uid,
                  sceneKey: 'taxi_smile',
                  imageData: '',
                  blurHeight: 23,
                  sceneAudioId: '',
                  prompt: 'Write the English situational prompt here.',
                  hint: '',
                  choices: [
                    { id: uid + '_a', korean: '', romanization: '', isCorrect: true, audioId: '' },
                    { id: uid + '_b', korean: '', romanization: '', isCorrect: false, audioId: '' },
                    { id: uid + '_c', korean: '', romanization: '', isCorrect: false, audioId: '' },
                    { id: uid + '_d', korean: '', romanization: '', isCorrect: false, audioId: '' }
                  ],
                  meaningEn: '',
                  grammarNote: ''
                });
                state.editorIdx = questions.length - 1;
                state.currentIdx = state.editorIdx;
                scheduleSave();
                renderApp();
                showToast(`Q${questions.length} 새 문항이 추가되었습니다.`, 'green');
                break;
              }
              case 'move-up': {
                const i = state.editorIdx;
                if (i > 0) {
                  [questions[i - 1], questions[i]] = [questions[i], questions[i - 1]];
                  state.editorIdx = i - 1;
                  state.currentIdx = i - 1;
                  scheduleSave();
                  renderApp();
                }
                break;
              }
              case 'move-down': {
                const i = state.editorIdx;
                if (i < questions.length - 1) {
                  [questions[i + 1], questions[i]] = [questions[i], questions[i + 1]];
                  state.editorIdx = i + 1;
                  state.currentIdx = i + 1;
                  scheduleSave();
                  renderApp();
                }
                break;
              }
              case 'del-q': {
                if (questions.length <= 1) return;
                openModal({
                  title: `Q${state.editorIdx + 1} 문항을 삭제할까요?`,
                  bodyHtml: '<p>선택한 문항이 목록에서 삭제됩니다.</p>',
                  confirmText: '문항 삭제',
                  confirmTone: 'danger',
                  onConfirm: () => {
                    stopPlayback();
                    questions.splice(state.editorIdx, 1);
                    state.editorIdx = Math.max(0, state.editorIdx - 1);
                    state.currentIdx = state.editorIdx;
                    scheduleSave();
                    renderApp();
                    showToast('문항이 삭제되었습니다.');
                  }
                });
                break;
              }
              case 'set-correct': {
                if (!q) return;
                const cIdx = Number(btn.getAttribute('data-choice-index'));
                q.choices.forEach((c, idx) => { c.isCorrect = idx === cIdx; });
                delete state.solvedMap[q.id];
                delete state.wrongAttemptsMap[q.id];
                scheduleSave();
                renderApp();
                break;
              }
              case 'auto-roman': {
                if (!q) return;
                const cIdx = Number(btn.getAttribute('data-choice-index'));
                const target = q.choices[cIdx];
                if (!target || !target.korean.trim()) {
                  showToast('먼저 한국어 문장을 입력해 주세요.', 'amber');
                  return;
                }
                target.romanization = generateRomanization(target.korean);
                scheduleSave();
                renderApp();
                break;
              }
              case 'add-choice': {
                if (!q || q.choices.length >= 4) return;
                q.choices.push({ id: q.id + '_c_' + Date.now(), korean: '', romanization: '', isCorrect: false, audioId: '' });
                scheduleSave();
                renderApp();
                break;
              }
              case 'del-choice': {
                if (!q || q.choices.length <= 2) return;
                const cIdx = Number(btn.getAttribute('data-choice-index'));
                const wasCorrect = q.choices[cIdx] && q.choices[cIdx].isCorrect;
                q.choices.splice(cIdx, 1);
                if (wasCorrect && q.choices[0]) q.choices[0].isCorrect = true;
                scheduleSave();
                renderApp();
                break;
              }
              case 'apply-same-kr': {
                if (!q) return;
                const cIdx = Number(btn.getAttribute('data-choice-index'));
                const src = q.choices[cIdx];
                if (!src || !src.audioId) return;
                const targetKr = String(src.korean || '').trim();
                if (!targetKr) {
                  showToast('한국어 문장이 비어 있습니다.', 'amber');
                  return;
                }
                let count = 0;
                state.quiz.questions.forEach((ques) => {
                  ques.choices.forEach((ch) => {
                    if (String(ch.korean || '').trim() === targetKr) {
                      ch.audioId = src.audioId;
                      count++;
                    }
                  });
                });
                scheduleSave();
                renderApp();
                showToast(`‘${targetKr}’ 문장이 포함된 총 ${count}개 보기에 오디오를 일괄 적용했습니다!`, 'green');
                break;
              }
              case 'clear-choice-audio': {
                if (!q) return;
                const cIdx = Number(btn.getAttribute('data-choice-index'));
                if (q.choices[cIdx]) {
                  stopPlayback();
                  q.choices[cIdx].audioId = '';
                  scheduleSave();
                  renderApp();
                  showToast('보기 오디오 연결이 해제되었습니다.');
                }
                break;
              }
              case 'clear-scene-audio': {
                if (!q) return;
                stopPlayback();
                q.sceneAudioId = '';
                scheduleSave();
                renderApp();
                break;
              }
              case 'clear-img': {
                if (!q) return;
                q.imageData = '';
                scheduleSave();
                renderApp();
                break;
              }
              case 'reset-ep1': {
                openModal({
                  title: '1화 기본 샘플로 초기화할까요?',
                  bodyHtml: '<p>모든 문항을 Episode 1: Basic Greetings (실례합니다 반영 6문항) 기본 상태로 복원합니다.</p>',
                  confirmText: '초기화',
                  confirmTone: 'danger',
                  onConfirm: () => {
                    stopPlayback();
                    state.quiz = createDefaultEp1Quiz();
                    state.editorIdx = 0;
                    state.currentIdx = 0;
                    state.solvedMap = {};
                    state.wrongAttemptsMap = {};
                    scheduleSave();
                    renderApp();
                    showToast('1화 기본 데이터로 복원되었습니다.', 'green');
                  }
                });
                break;
              }
            }
          };
        });
      }

      async function handleChoiceAudioFile(file, q, cIdx) {
        try {
          const payload = await readAudioWithMetadata(file);
          const { audioId } = registerAudioInPool(payload);
          q.choices[cIdx].audioId = audioId;
          scheduleSave();
          renderApp();
          showToast(`‘${payload.name}’ (${payload.durationText}) 오디오가 연결되었습니다!`, 'green');
        } catch (err) {
          showToast(err.message || '오디오 업로드 실패', 'amber');
        }
      }

      async function handleSceneAudioFile(file, q) {
        try {
          const payload = await readAudioWithMetadata(file);
          const { audioId } = registerAudioInPool(payload);
          q.sceneAudioId = audioId;
          scheduleSave();
          renderApp();
          showToast(`Step 3 장면 오디오(‘${payload.name}’)가 연결되었습니다!`, 'green');
        } catch (err) {
          showToast(err.message || '오디오 업로드 실패', 'amber');
        }
      }

      async function handleSceneImageFile(file, q) {
        try {
          const dataUrl = await compressImageFile(file, 960, 0.84);
          q.imageData = dataUrl;
          scheduleSave();
          renderApp();
          showToast('장면 이미지가 적용되었습니다!', 'green');
        } catch (err) {
          showToast(err.message || '이미지 처리 오류', 'amber');
        }
      }

      window.addEventListener('paste', async (e) => {
        if (IS_LEARNER_ONLY || state.viewMode !== 'editor') return;
        const items = e.clipboardData && e.clipboardData.items;
        if (!items) return;
        for (let i = 0; i < items.length; i++) {
          if (items[i].type && items[i].type.startsWith('image/')) {
            e.preventDefault();
            const file = items[i].getAsFile();
            const q = state.quiz.questions[state.editorIdx];
            if (file && q) await handleSceneImageFile(file, q);
            break;
          }
        }
      });

      /* =========================================================================
       * 16. TOP BAR: BACKUP JSON, RESTORE JSON & TRUE CLONE SELF-CONTAINED EXPORT
       * ========================================================================= */
      function bindTopNavEvents(scope) {
        scope.querySelectorAll('[data-nav]').forEach((btn) => {
          btn.onclick = () => {
            const nav = btn.getAttribute('data-nav');
            if (nav === 'learner') {
              stopPlayback();
              state.viewMode = 'learner';
              renderApp();
            } else if (nav === 'editor') {
              stopPlayback();
              state.viewMode = 'editor';
              state.isSummaryOpen = false;
              state.editorIdx = state.currentIdx;
              renderApp();
            } else if (nav === 'backup-json') {
              const blob = new Blob([JSON.stringify(state.quiz, null, 2)], { type: 'application/json;charset=utf-8' });
              downloadFile(blob, 'asyougokorean-ep1-backup.json');
              showToast('백업 파일(asyougokorean-ep1-backup.json)이 저장되었습니다.', 'green');
            } else if (nav === 'export-html') {
              exportStandaloneLearnerHtml();
            }
          };
        });

        const loadInp = document.getElementById('nav-load-json');
        if (loadInp) {
          loadInp.onchange = (e) => {
            const file = e.target.files && e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
              try {
                const parsed = JSON.parse(ev.target.result);
                if (!parsed || !Array.isArray(parsed.questions) || !parsed.questions.length) {
                  showToast('올바른 백업 JSON 파일이 아닙니다.', 'amber');
                  return;
                }
                stopPlayback();
                state.quiz = normalizeQuiz(parsed);
                state.currentIdx = 0;
                state.editorIdx = 0;
                state.solvedMap = {};
                state.wrongAttemptsMap = {};
                state.isSummaryOpen = false;
                scheduleSave();
                renderApp();
                showToast('백업 프로젝트를 불러왔습니다!', 'green');
              } catch (_) {
                showToast('JSON 파일을 읽는 중 오류가 발생했습니다.', 'amber');
              }
            };
            reader.readAsText(file);
          };
        }
      }

      function downloadFile(blob, filename) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        setTimeout(() => {
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        }, 300);
      }

      function buildPrunedQuizForExport() {
        const clone = JSON.parse(JSON.stringify(state.quiz));
        const usedIds = new Set();
        clone.questions.forEach((q) => {
          if (q.sceneAudioId) usedIds.add(q.sceneAudioId);
          (q.choices || []).forEach((c) => {
            if (c.audioId) usedIds.add(c.audioId);
          });
        });
        const cleanPool = {};
        usedIds.forEach((id) => {
          if (clone.audioPool && clone.audioPool[id]) cleanPool[id] = clone.audioPool[id];
        });
        clone.audioPool = cleanPool;
        return clone;
      }

      function buildStandaloneIndexHtmlString(exportQuiz) {
        // 1. Clone entire live document DOM
        const docClone = document.documentElement.cloneNode(true);
        docClone.setAttribute('lang', 'en');
        docClone.setAttribute('data-learner-only', 'true');

        // 2. Update <title>
        const titleEl = docClone.querySelector('title');
        if (titleEl) {
          titleEl.textContent = `${exportQuiz.episodeSubtitle} | ${exportQuiz.channelTitle}`;
        }

        // 3. Completely strip Studio Toolbar, Editor View, and transient modals/toasts
        const studioToolbar = docClone.querySelector('#studio-toolbar');
        if (studioToolbar) studioToolbar.remove();

        const editorView = docClone.querySelector('#editor-view');
        if (editorView) editorView.remove();

        const learnerView = docClone.querySelector('#learner-view');
        if (learnerView) {
          learnerView.innerHTML = '';
          learnerView.classList.remove('hidden');
        }

        const learnerHeader = docClone.querySelector('#learner-only-header');
        if (learnerHeader) {
          learnerHeader.innerHTML = '';
          learnerHeader.classList.remove('hidden');
        }

        const modalRoot = docClone.querySelector('#modal-root');
        if (modalRoot) modalRoot.innerHTML = '';

        const toastRoot = docClone.querySelector('#toast-root');
        if (toastRoot) toastRoot.innerHTML = '';

        // 4. Inject serialized JSON payload (escaping </ to <\/ so script tags never close early)
        const payloadScript = docClone.querySelector('#EMBEDDED_QUIZ_PAYLOAD');
        const safeJson = JSON.stringify(exportQuiz)
          .replace(/<\//g, '<\\/')
          .replace(/<!--/g, '<\\!--');
        if (payloadScript) {
          payloadScript.textContent = safeJson;
        }

        return '<!DOCTYPE html>\n' + docClone.outerHTML;
      }

      function exportStandaloneLearnerHtml() {
        stopPlayback();
        const exportQuiz = buildPrunedQuizForExport();
        const htmlString = buildStandaloneIndexHtmlString(exportQuiz);
        const blob = new Blob([htmlString], { type: 'text/html;charset=utf-8' });

        // Directly download as 'index.html' so user can upload straight to GitHub without renaming
        downloadFile(blob, 'index.html');

        // Calculate exact counts of embedded media for user verification
        const customImageCount = exportQuiz.questions.filter((q) => Boolean(q.imageData && q.imageData.trim())).length;
        const uniqueAudioCount = Object.keys(exportQuiz.audioPool).length;
        let connectedAudioSlots = 0;
        exportQuiz.questions.forEach((q) => {
          if (q.sceneAudioId && exportQuiz.audioPool[q.sceneAudioId]) connectedAudioSlots++;
          (q.choices || []).forEach((c) => {
            if (c.audioId && exportQuiz.audioPool[c.audioId]) connectedAudioSlots++;
          });
        });
        const totalSizeLabel = formatBytesMB(blob.size);
        const isEmptyMediaWarning = customImageCount === 0 && uniqueAudioCount === 0;

        openModal({
          title: '✅ 배포용 단독 index.html 생성 및 다운로드 완료!',
          confirmText: 'index.html 다시 다운로드',
          bodyHtml: `
            <p class="text-slate-700">
              상단 편집 바가 완전히 제거된 <strong>순수 학습자 전용 <code>index.html</code></strong> 파일이 다운로드되었습니다. 이름 변경 없이 그대로 GitHub(<code>ep1</code> 저장소)에 올리시면 됩니다!
            </p>

            <div class="p-4 rounded-2xl bg-[#ECFDF5] border border-emerald-200 text-xs sm:text-sm text-[#059669] space-y-1.5">
              <div class="font-extrabold text-[#1E293B] mb-1">📦 내장 데이터 검증 리포트</div>
              <div>• 포함 문항 수: <strong>${exportQuiz.questions.length}문항</strong></div>
              <div>• 내장된 장면 이미지: <strong>${customImageCount} / ${exportQuiz.questions.length}개</strong></div>
              <div>• 내장된 오디오 파일: <strong>${uniqueAudioCount}개</strong> (문장 연결 ${connectedAudioSlots}곳)</div>
              <div>• 전체 파일 용량: <strong>${esc(totalSizeLabel)}</strong></div>
            </div>

            ${
              isEmptyMediaWarning
                ? `<div class="p-3.5 rounded-2xl bg-[#FFFBEB] border border-amber-300 text-xs text-amber-950 space-y-1">
                    <div class="font-extrabold">⚠️ 현재 내장된 이미지·오디오가 0개입니다!</div>
                    <div>이 파일을 새 폴더에서 여셨거나 브라우저 저장소가 비어 있는 상태입니다. <strong>[📂 불러오기]</strong>로 기존 백업(.json)을 불러오시거나 편집 탭에서 사진·오디오를 올린 뒤 다시 내보내 주세요.</div>
                   </div>`
                : `<p class="text-xs text-slate-500">
                    다운로드된 <strong><code>index.html</code></strong> 파일(용량 ${esc(totalSizeLabel)})을 GitHub에 올린 뒤 <code>Ctrl + Shift + R</code>로 강력 새로고침하시면 모든 사진과 오디오가 바로 작동합니다.
                   </p>`
            }
          `,
          onConfirm: () => {
            const reBlob = new Blob([htmlString], { type: 'text/html;charset=utf-8' });
            downloadFile(reBlob, 'index.html');
            showToast('index.html 파일이 다시 다운로드되었습니다!', 'green');
          }
        });
      }

      /* =========================================================================
       * 17. INIT BOOTSTRAP
       * ========================================================================= */
      async function init() {
        renderApp();
        if (!IS_LEARNER_ONLY) {
          const loaded = await loadProjectFromDb();
          if (loaded) {
            state.quiz = loaded;
            renderApp();
            const imgCnt = loaded.questions.filter((q) => Boolean(q.imageData)).length;
            const audCnt = Object.keys(loaded.audioPool || {}).length;
            if (imgCnt > 0 || audCnt > 0) {
              showToast(`기존 작업 복구 완료! (이미지 ${imgCnt}개 · 오디오 ${audCnt}개)`, 'green');
            }
          }
        }
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    })();
  </script>

</body></html>
